# Zotero library registry — example.
#
# Real file lives at $ZOTERO_LIBRARIES_FILE (default ~/.config/claude-zotero/libraries.yml).
# Generate or refresh it with:  python3 skills/zotero/scripts/zotero.py libraries --sync
#
# Library names become `--library NAME`; collection names become `--collection NAME`
# (full path, or a unique leaf like "Keep"). API keys are account-wide, so this file
# carries no secrets — only numeric ids and collection keys.
#
# Env vars layer on top and win on conflict:
#   ZOTERO_USER_ID                            -> the "user" (personal) library
#   ZOTERO_<NAME>_LIBRARY_ID / _LIBRARY_TYPE  -> add/override library NAME

libraries:
  user:                       # the personal library: --library user
    id: 1234567
    type: user
    collections:
      Reading List: ABCD1234
  SLR:                        # a group library: --library SLR
    id: 6505702
    type: group
    collections:
      02-Screening / 00-Queue: EFGH5678
      02-Screening / 01-Keep: IJKL9012
      02-Screening / 02-Maybe: MNOP3456
